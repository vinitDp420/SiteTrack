<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - SiteTrack</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "spacing": {

<style>
        .custom-shadow { box-shadow: 0 8px 24px -4px rgba(13, 28, 50, 0.12); }
    </style>

<body class="h-full bg-background text-on-background font-body-md antialiased flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Login Card -->
<main class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl custom-shadow flex flex-col overflow-hidden">
<!-- Header / Logo Area -->
<div class="px-md pt-lg pb-md flex flex-col items-center border-b border-surface-container-highest bg-surface">
<div class="w-20 h-20 bg-primary-container rounded-lg flex items-center justify-center mb-md text-on-primary shadow-sm">
<span class="material-symbols-outlined" style="font-size: 40px; font-variation-settings: 'FILL' 1;">business</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-primary tracking-tight text-center">SiteTrack</h1>
<p class="font-body-md text-on-surface-variant mt-xs text-center">Sign in to your mission control.</p>
</div>
<!-- Form Area -->
<form action="#" class="p-md flex flex-col gap-md" method="POST">
<!-- Role Selector -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-on-surface-variant uppercase tracking-wider" for="role">Select Role</label>
<div class="relative">
<select class="appearance-none w-full bg-surface-container-low border border-outline-variant text-on-surface font-body-md rounded h-[48px] px-sm pr-10 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all" id="role" name="role">
<option>Administrator</option>
<option>Supervisor</option>
<option>Worker</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-sm text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant z-10 pointer-events-none">mail</span>
<input class="w-full bg-surface-container-low border border-outline-variant text-on-surface font-body-md rounded h-[48px] pl-10 pr-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary placeholder-on-surface-variant/50 transition-all" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-label-md text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant z-10 pointer-events-none">lock</span>
<input class="w-full bg-surface-container-low border border-outline-variant text-on-surface font-body-md rounded h-[48px] pl-10 pr-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary placeholder-on-surface-variant/50 transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-5 w-5 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-low" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-on-surface" for="remember-me">Remember this device</label>
</div>
<!-- Submit Button -->
<button class="mt-xs w-full bg-primary-container text-on-primary h-[48px] rounded-lg font-label-xl uppercase tracking-wider flex items-center justify-center gap-xs hover:bg-primary-container/90 active:scale-[0.98] transition-all" type="submit">
<span>Login</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Footer / Support -->
<div class="px-md py-sm bg-surface-container-lowest border-t border-surface-container-highest text-center">
<p class="font-label-md text-on-surface-variant">Need access? <a class="text-primary hover:underline font-bold" href="#">Contact IT Support</a></p>
</div>
</main>
</body></html>
