<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation Diagrams</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background-color: #f8fafc; padding: 20px; }
        h1 { color: #0f172a; }
        p { color: #475569; font-size: 18px; margin-bottom: 40px; }
        .diagram { margin-bottom: 60px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .diagram h2 { color: #334155; }
        img { max-width: 100%; height: auto; border: 1px solid #e2e8f0; }
        .instructions { background-color: #dbeafe; color: #1e3a8a; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 20px; margin-bottom: 40px;}
    </style>
</head>
<body>
    <h1>Your Project Diagrams</h1>
    <div class="instructions">
        💡 INSTRUCTIONS: Right-click on any image below and select "Copy Image", then paste it into your PowerPoint!
    </div>

    <div class="diagram">
        <h2>1. Detailed System Architecture</h2>
        <img src="detailed_architecture_ppt.png" alt="Detailed System Architecture">
    </div>

    <div class="diagram">
        <h2>2. High-Level System Architecture</h2>
        <img src="system_architecture_ppt.png" alt="High-Level System Architecture">
    </div>

    <div class="diagram">
        <h2>3. Process Flow</h2>
        <img src="process_flow_ppt.png" alt="Process Flow">
    </div>

    <div class="diagram">
        <h2>4. Gantt Chart</h2>
        <img src="gantt_chart_ppt_updated.png" alt="Gantt Chart">
    </div>
</body>
</html>
