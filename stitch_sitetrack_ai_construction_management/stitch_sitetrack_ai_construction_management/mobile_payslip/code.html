<body class="bg-surface text-on-surface h-screen flex flex-col md:hidden">
<!-- Header (Simulated for Payslip context) -->
<header class="w-full top-0 sticky bg-surface border-b border-outline-variant px-margin-mobile py-4 flex items-center justify-between z-10">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Payslip</h1>
<button class="w-touch-target h-touch-target flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="file_download">file_download</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto px-margin-mobile py-lg pb-[100px]">
<!-- Payslip Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md shadow-sm">
<div class="flex justify-between items-start mb-lg">
<div>
<p class="font-label-xl text-label-xl text-on-surface-variant mb-xs">PAY PERIOD</p>
<h2 class="font-headline-md text-headline-md text-primary">October 2023</h2>
</div>
<div class="bg-secondary-container text-on-secondary-container px-sm py-xs rounded-full font-label-md text-label-md">
                    Paid
                </div>
</div>
<!-- Breakdown -->
<div class="space-y-sm mb-lg">
<div class="flex justify-between items-center py-sm border-b border-surface-variant">
<span class="font-body-md text-body-md text-on-surface-variant">Days Worked</span>
<span class="font-headline-md text-headline-md text-primary">22</span>
</div>
<div class="flex justify-between items-center py-sm border-b border-surface-variant">
<span class="font-body-md text-body-md text-on-surface-variant">Daily Wage Rate</span>
<span class="font-body-md text-body-md text-primary font-semibold">$150.00</span>
</div>
<div class="flex justify-between items-center py-sm border-b border-surface-variant">
<span class="font-body-md text-body-md text-on-surface-variant">Overtime (12 hrs)</span>
<span class="font-body-md text-body-md text-primary font-semibold">$270.00</span>
</div>
</div>
<!-- Total -->
<div class="bg-surface-container py-md px-md rounded-lg mb-lg">
<p class="font-label-xl text-label-xl text-on-surface-variant mb-xs text-center">TOTAL NET PAY</p>
<h3 class="font-display-lg text-display-lg text-primary text-center">$3,570.00</h3>
</div>
<!-- Action -->
<button class="w-full bg-primary text-on-primary h-touch-target rounded-lg font-label-xl text-label-xl flex items-center justify-center gap-2 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]" data-icon="download">download</span>
                Download PDF
            </button>
</div>
</main>
<!-- BottomNavBar (Shared Component JSON applied exactly) -->
<nav class="bg-surface dark:bg-inverse-surface border-t border-outline-variant dark:border-on-surface-variant shadow-lg fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-2 pb-safe z-50">
<!-- Home (Inactive) -->
<div class="flex flex-col items-center justify-center text-on-surface-variant tap-highlight-none transition-transform duration-100 active:bg-surface-variant p-2 rounded-lg cursor-pointer">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-label-md mt-1">Home</span>
</div>
<!-- History (Inactive) -->
<div class="flex flex-col items-center justify-center text-on-surface-variant tap-highlight-none transition-transform duration-100 active:bg-surface-variant p-2 rounded-lg cursor-pointer">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label-md text-label-md mt-1">History</span>
</div>
<!-- Payslip (Active) -->
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 tap-highlight-none transition-transform duration-100 cursor-default">
<span class="material-symbols-outlined" data-icon="receipt_long" data-weight="fill" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
<span class="font-label-md text-label-md mt-1">Payslip</span>
</div>
<!-- Profile (Inactive) -->
<div class="flex flex-col items-center justify-center text-on-surface-variant tap-highlight-none transition-transform duration-100 active:bg-surface-variant p-2 rounded-lg cursor-pointer">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-md text-label-md mt-1">Profile</span>
</div>
