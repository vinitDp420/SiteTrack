<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Worker Mobile View</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#44474d",
                        "surface-tint": "#515f78",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#b87500",
                        "on-tertiary": "#ffffff",

                        "inverse-surface": "#2d3133",

                        "outline-variant": "#c5c6cd",
                        "secondary-fixed-dim": "#bcc7dd",
                        "outline": "#75777e",
                        "on-primary-fixed": "#0d1c32",
                        "surface-variant": "#e0e3e5",
                        "on-secondary-container": "#586377",
                        "on-surface": "#191c1e",
                        "primary-fixed": "#d6e3ff",
                        "tertiary-fixed": "#ffddb8",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#f2f4f6",
                        "surface-container-highest": "#e0e3e5",
                        "error-container": "#ffdad6",
                        "surface": "#f7f9fb",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary-fixed": "#2a1700",
                        "primary-fixed-dim": "#b9c7e4",
                        "inverse-primary": "#b9c7e4",
                        "secondary-container": "#d5e0f7",
                        "background": "#f7f9fb",

                        "tertiary": "#000000",
                        "surface-container-high": "#e6e8ea",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#2a1700",
                        "surface-container": "#eceef0",
                        "on-primary-container": "#76849f",
                        "secondary-fixed": "#d8e3fa",
                        "on-background": "#191c1e",
                        "secondary": "#545f72",
                        "primary-container": "#0d1c32",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-secondary-fixed": "#111c2c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "12px",
                        "lg": "40px",
                        "xs": "4px",
                        "base": "8px",
                        "md": "24px",
                        "touch-target": "48px",
                        "xl": "64px",
                        "margin-desktop": "48px",
                        "margin-mobile": "16px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],

                        "label-xl": ["Inter"],
                        "display-lg": ["Inter"]

                    "fontSize": {

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden selection:bg-primary selection:text-on-primary">
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile pb-[100px] gap-md">
<!-- Status Header -->
<div class="text-center w-full max-w-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-xs">Today's Shift</h1>
<div class="inline-flex items-center gap-xs px-md py-base bg-surface-container-high rounded-full border border-outline-variant shadow-sm mt-base">
<span class="w-3 h-3 rounded-full bg-error animate-pulse"></span>
<span class="font-label-xl text-label-xl text-on-surface-variant">Checked Out</span>
</div>
</div>
<!-- Giant Check In / Out Button -->
<button class="relative w-64 h-64 rounded-full bg-[#1e293b] text-on-primary shadow-lg border-4 border-[#334155] flex flex-col items-center justify-center gap-sm transition-transform active:scale-95 touch-manipulation tap-highlight-none">
<div class="absolute inset-0 rounded-full border-4 border-[#cbd5e1] opacity-20"></div>
<span class="material-symbols-outlined text-display-lg" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
<span class="font-headline-md text-headline-md tracking-wide">CHECK IN</span>
</button>
<!-- Hours Worked Summary -->
<div class="w-full max-w-sm bg-surface-container-lowest rounded-xl border border-outline-variant p-md shadow-sm mt-lg">
<h2 class="font-label-xl text-label-xl text-on-surface-variant uppercase tracking-wider mb-sm">Hours Worked Today</h2>
<div class="flex items-end gap-sm">
<span class="font-display-lg text-display-lg text-on-background">0.0</span>
<span class="font-body-lg text-body-lg text-on-surface-variant mb-xs">hrs</span>
</div>
<div class="mt-md flex justify-between items-center border-t border-outline-variant pt-sm">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant">Start Time</span>
<span class="font-body-md text-body-md text-on-background font-semibold">--:-- AM</span>
</div>
<div class="w-px h-8 bg-outline-variant"></div>
<div class="flex flex-col text-right">
<span class="font-label-md text-label-md text-on-surface-variant">Location</span>
<span class="font-body-md text-body-md text-on-background font-semibold truncate max-w-[120px]">Site A</span>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Only based on intent) -->
<nav class="md:hidden bg-surface dark:bg-inverse-surface fixed bottom-0 w-full z-50 border-t border-outline-variant dark:border-on-surface-variant shadow-lg fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-2 pb-safe">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 tap-highlight-none transition-transform duration-100" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label-md text-label-md mt-xs">Home</span>
</a>
<!-- History -->
<a class="flex flex-col items-center justify-center text-on-surface-variant active:bg-surface-variant tap-highlight-none transition-transform duration-100 px-4 py-1 rounded-xl" href="#">
<span class="material-symbols-outlined">history</span>
<span class="font-label-md text-label-md mt-xs">History</span>
</a>
<!-- Payslip -->
<a class="flex flex-col items-center justify-center text-on-surface-variant active:bg-surface-variant tap-highlight-none transition-transform duration-100 px-4 py-1 rounded-xl" href="#">
<span class="material-symbols-outlined">receipt_long</span>
<span class="font-label-md text-label-md mt-xs">Payslip</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant active:bg-surface-variant tap-highlight-none transition-transform duration-100 px-4 py-1 rounded-xl" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-md text-label-md mt-xs">Profile</span>
</a>
</nav>
</body></html>
